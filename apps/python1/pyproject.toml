[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

ignore = ["B008"]

[project]
name = "anvil"
version = "0.1.0"
description = "Anvil application"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "crawl4ai>=0.9.2",
    "fastapi>=0.141.1",
    "langchain-litellm>=0.7.0",
    "openai>=2.50.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "sse-starlette>=3.4.6",
    "uvicorn>=0.52.0",
]
